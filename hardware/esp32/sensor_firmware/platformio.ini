; GreenCompute AI — PlatformIO configuration for ESP32 INA219 sensor

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit INA219@^1.2.1
    adafruit/Adafruit BusIO@^1.14.5

; WiFi and HTTPClient are built-in to the ESP32 Arduino core
